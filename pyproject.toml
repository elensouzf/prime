[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.1.0"
description = "Assistente de tarefas com suporte a intents e confirmações."
requires-python = ">=3.10"
authors = [{name = "Assistant"}]
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
